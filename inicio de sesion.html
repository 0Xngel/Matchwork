<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Matchwork</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-header h2 {
      color: #333;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #007bff;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #0056b3;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .alert-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .login-footer a {
      color: #007bff;
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h2>Matchwork</h2>
      <p>Ingresa tus datos para acceder</p>
    </div>

    <!-- Cajas de alerta para la respuesta del Login -->
    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="usuario@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Iniciar Sesión</button>
    </form>

    <div class="login-footer">
      <p>¿No tienes una cuenta? <a href="#">Regístrate</a></p>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');

    loginForm.addEventListener('submit', function(event) {
      event.preventDefault(); // Evitar recargar la página

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      // Ocultar alerta previa
      alertBox.style.display = 'none';

      // Validación simple
      if (email === '' || password === '') {
        showAlert('Por favor, completa todos los campos.', 'error');
        return;
      }

      if (password.length < 6) {
        showAlert('La contraseña debe tener al menos 6 caracteres.', 'error');
        return;
      }

      // Simulación de respuesta de backend
      btnSubmit.innerText = 'Cargando...';
      btnSubmit.disabled = true;

      setTimeout(() => {
        // Credenciales de prueba
        if (email === "usuario@ejemplo.com" && password === "123456") {
          showAlert('¡Inicio de sesión exitoso! Redirigiendo...', 'success');
          setTimeout(() => {
            alert("¡Bienvenido a Matchwork!");
            // Aquí puedes redirigir a la pantalla principal cuando la tengan creada:
            // window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          showAlert('Correo o contraseña incorrectos.', 'error');
          btnSubmit.innerText = 'Iniciar Sesión';
          btnSubmit.disabled = false;
        }
      }, 1200);
    });

    function showAlert(message, type) {
      alertBox.innerText = message;
      alertBox.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertBox.style.display = 'block';
    }
  </script>

</body>
</html>
