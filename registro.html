<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Matchwork</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    .register-container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }

    .register-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .register-header h2 {
      color: #333;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .register-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #444;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #007bff;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #218838;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .alert-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .register-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .register-footer a {
      color: #007bff;
      text-decoration: none;
      font-weight: 600;
    }

    .register-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="register-header">
      <h2>Matchwork</h2>
      <p>Crea tu cuenta para comenzar</p>
    </div>

    <!-- Alertas dinámicas -->
    <div id="alertBox" class="alert"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullName">Nombre Completo</label>
        <input type="text" id="fullName" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="usuario@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="role">Tipo de Usuario</label>
        <select id="role" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="busco_empleo">Busco Empleo (Candidato)</option>
          <option value="ofrezco_empleo">Ofrezco Empleo (Empresa/Reclutador)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Crear Cuenta</button>
    </form>

    <div class="register-footer">
      <p>¿Ya tienes una cuenta? <a href="inicio de sesion.html">Inicia Sesión</a></p>
    </div>
  </div>

  <script>
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');

    registerForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      alertBox.style.display = 'none';

      // Validaciones básicas
      if (!fullName || !email || !role || !password || !confirmPassword) {
        showAlert('Por favor, llena todos los campos.', 'error');
        return;
      }

      if (password.length < 6) {
        showAlert('La contraseña debe tener al menos 6 caracteres.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Las contraseñas no coinciden.', 'error');
        return;
      }

      // Simulación de creación de cuenta
      btnSubmit.innerText = 'Registrando...';
      btnSubmit.disabled = true;

      setTimeout(() => {
        showAlert('¡Cuenta creada con éxito! Redirigiendo al inicio de sesión...', 'success');
        
        setTimeout(() => {
          window.location.href = 'inicio de sesion.html';
        }, 1500);
      }, 1000);
    });

    function showAlert(message, type) {
      alertBox.innerText = message;
      alertBox.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertBox.style.display = 'block';
    }
  </script>

</body>
</html>
